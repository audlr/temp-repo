<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="plotly.min.js"></script>
<style>
  :root { --mc: #1f77b4; --ms: #ff7f0e; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Source Sans Pro", "Segoe UI", sans-serif;
         color: #262730; background: #ffffff; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .head h4 { margin: 2px 0 4px; font-size: 21px; }
  .head .state { color: var(--muted); font-size: 13px; }
  .chips { display: grid; grid-template-columns: 1.55fr .95fr .9fr .95fr 1fr 1.35fr 1fr;
           gap: 0 10px; font-size: 13px; padding: 6px 10px; border-radius: 8px;
           background: #f6f7f9; }
  .chips div { display: flex; flex-direction: column; min-width: 0; }
  .chips .k, .chips .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips .k { color: var(--muted); font-size: 11.5px; }
  .chips .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .mc .chips { border-left: 4px solid var(--mc); }
  .ms .chips { border-left: 4px solid var(--ms); }
  .bar { height: 4px; background: #eef0f3; border-radius: 2px; margin: 6px 0 0; overflow: hidden; }
  .bar > div { height: 100%; width: 0; }
  .mc .bar > div { background: var(--mc); }
  .ms .bar > div { background: var(--ms); }
  .plotwrap { position: relative; width: min(100%, 600px); aspect-ratio: 1 / 1;
              margin: 2px auto 0; }
  .plot { position: absolute; inset: 0; }
  canvas.layer { position: absolute; left: 0; top: 0; pointer-events: none; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px;
            font-size: 12px; color: #444; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
  .legend i.dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend i.line { width: 14px; height: 0; border-top: 2px solid; }
</style>
</head>
<body>
<div class="cols">
  <div class="panel mc">
    <div class="head"><h4 style="color:var(--mc)">Plain Monte Carlo</h4>
      <span class="state" id="mc-state"></span></div>
    <div class="chips" id="mc-chips"></div>
    <div class="bar"><div id="mc-bar"></div></div>
    <div class="plotwrap" id="mc-wrap"><div class="plot" id="mc-plot"></div></div>
    <div class="legend" id="mc-legend"></div>
  </div>
  <div class="panel ms">
    <div class="head"><h4 style="color:var(--ms)">MISER Algorithm</h4>
      <span class="state" id="ms-state"></span></div>
    <div class="chips" id="ms-chips"></div>
    <div class="bar"><div id="ms-bar"></div></div>
    <div class="plotwrap" id="ms-wrap"><div class="plot" id="ms-plot"></div></div>
    <div class="legend" id="ms-legend"></div>
  </div>
</div>

<script>
/*
 * Circle-sampling player (no controls: started by the sidebar's Run Comparison).
 *
 * Plotly draws only the empty unit-square axes. Points are painted on a canvas
 * layer and only the NEW points are painted each frame, so earlier points are
 * kept and 100k samples stay smooth. Layers (bottom → top):
 *   plotly axes | MISER split lines | points | circle + current MISER region
 *
 * Inside/outside colouring uses the algorithm's own f values (circle indicator,
 * 1 = inside), i.e. the real judgement made during the run.
 */

function send(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data || {}), "*");
}
function setHeight() { send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 6}); }

const C = {mc: "#1f77b4", ms: "#ff7f0e", circle: "#202020", current: "#c2410c"};
const INSIDE = {mc: "rgba(31,119,180,0.75)", ms: "rgba(255,127,14,0.80)"};
const OUTSIDE = {mc: "rgba(148,163,184,0.45)", ms: "rgba(148,163,184,0.45)"};

let D = null, S = null, rafId = null, PM = null, PS = null;
const $ = (id) => document.getElementById(id);
const fmtInt = (x) => Math.round(x).toLocaleString("en-US");
const fmt = (x, d = 6) => Number.isFinite(x) ? x.toFixed(d) : "—";

// ---------------------------------------------------------------- plot + layers
const LAYOUT = () => ({
  margin: {l: 40, r: 10, t: 8, b: 36}, showlegend: false, dragmode: false,
  xaxis: {range: [0, 1], title: {text: "X", standoff: 4}, zeroline: false,
          fixedrange: true, constrain: "domain", dtick: 0.2},
  yaxis: {range: [0, 1], title: {text: "Y", standoff: 4}, zeroline: false,
          fixedrange: true, scaleanchor: "x", constrain: "domain", dtick: 0.2},
  plot_bgcolor: "#fff", paper_bgcolor: "rgba(0,0,0,0)",
});
const CFG = {displayModeBar: false, responsive: true};

function makePanel(key) {
  const wrap = $(key + "-wrap");
  wrap.querySelectorAll("canvas").forEach((c) => c.remove());
  const layers = {};
  for (const name of ["heat", "splits", "points", "top"]) {
    const c = document.createElement("canvas");
    c.className = "layer"; wrap.appendChild(c); layers[name] = c;
  }
  return {key, gd: $(key + "-plot"), layers, map: null, painted: 0};
}

function fitPanel(P) {
  const xa = P.gd._fullLayout.xaxis, ya = P.gd._fullLayout.yaxis;
  const dpr = window.devicePixelRatio || 1, W = P.gd.clientWidth, H = P.gd.clientHeight;
  for (const c of Object.values(P.layers)) {
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    c.style.width = W + "px"; c.style.height = H + "px";
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.beginPath(); ctx.rect(xa._offset, ya._offset, xa._length, ya._length); ctx.clip();
  }
  P.map = {px: (x) => xa._offset + x * xa._length,
           py: (y) => ya._offset + (1 - y) * ya._length, scale: xa._length};
  P.painted = 0;
}

function clearLayer(c) {
  const ctx = c.getContext("2d");
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); ctx.restore();
}

function dot(ctx, x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832); }

// 배경 히트맵을 그리기 위해 추가
function paintHeat(P) {
  const c = P.layers.heat, ctx = c.getContext("2d"), m = P.map, H = D.heat || [], k = H.length;
  clearLayer(c);
  if (!k) return;
  const cs = m.scale / k;
  for (let j = 0; j < k; j++) for (let i = 0; i < k; i++) {
    const v = Math.max(0, H[j][i]); if (v < 0.01) continue;
    ctx.fillStyle = `rgba(90,90,90,${0.06 + 0.3 * v})`;
    ctx.fillRect(m.px(i / k), m.py((j + 1) / k), cs + 0.6, cs + 0.6);
  }
}

// 분할할 때 잠깐 멈추고 % 비율을 강조하기 위해 추가
const PAUSE_DEPTH = 3, PAUSE_MS = 700;
function halves(s) {
  const [axis, x0, x1, y0, y1, c] = [s[6], s[7], s[8], s[9], s[10], axisCoord(s)];
  return axis === 0 ? [[x0, c, y0, y1], [c, x1, y0, y1]] : [[x0, x1, y0, c], [x0, x1, c, y1]];
}
function axisCoord(s) { return s[6] === 0 ? s[1] : s[2]; }
function paintDecision(ctx, m, ts) {
  const s = D.ms.splits[S.decision], H = halves(s), share = [s[11], 1 - s[11]];
  const big = share[0] >= share[1] ? 0 : 1;
  const flash = 0.5 * Math.max(0, 1 - (ts - S.pauseStart) / PAUSE_MS);
  H.forEach((h, i) => {
    ctx.fillStyle = i === big ? `rgba(255,127,14,${flash})` : "rgba(120,120,120,0.08)";
    ctx.fillRect(m.px(h[0]), m.py(h[3]), m.px(h[1]) - m.px(h[0]), m.py(h[2]) - m.py(h[3]));
  });
  ctx.strokeStyle = "#7f3f00"; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(m.px(s[1]), m.py(s[2])); ctx.lineTo(m.px(s[3]), m.py(s[4])); ctx.stroke();
  H.forEach((h, i) => {
    const txt = `${Math.round(100 * share[i])}%`, cx = m.px((h[0] + h[1]) / 2), cy = m.py((h[2] + h[3]) / 2);
    ctx.font = (i === big ? "bold " : "") + "13px sans-serif"; ctx.textAlign = "center";
    const w = ctx.measureText(txt).width + 8;
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillRect(cx - w / 2, cy - 11, w, 16);
    ctx.fillStyle = i === big ? "#7f3f00" : "#555"; ctx.fillText(txt, cx, cy + 1);
  });
}

// 연속값 시나리오를 5단계 진하기로 그리기 위해 추가
const RGB = {mc: "31,119,180", ms: "255,127,14"};
function shadeOf(v) { return Math.min(4, Math.floor(5 * v / (D.vmax || 1))); }

// Append samples [from, to): coloured by the algorithm's own inside/outside value.
function paintPoints(P, src, from, to) {
  if (to <= from) return;
  P.painted += to - from;
  const ctx = P.layers.points.getContext("2d"), m = P.map;
  const r = Math.max(1.3, Math.min(2.2, 9000 / Math.max(D.n, 1)));
  // 파일럿 점을 보라색으로 그리기 위해 추가
  if (src.kind) {
    ctx.fillStyle = "rgba(122,60,170,0.30)"; ctx.beginPath();
    for (let i = from; i < to; i++) if (src.kind[i] === 0) dot(ctx, m.px(src.x[i]), m.py(src.y[i]), r);
    ctx.fill();
  }
  const prod = (i) => !src.kind || src.kind[i] === 1;
  if (!D.binary) {
    for (let b = 0; b < 5; b++) {
      ctx.fillStyle = b === 0 ? OUTSIDE[P.key] : `rgba(${RGB[P.key]},${0.2 + 0.18 * b})`;
      ctx.beginPath();
      for (let i = from; i < to; i++)
        if (prod(i) && shadeOf(src.v[i]) === b) dot(ctx, m.px(src.x[i]), m.py(src.y[i]), r);
      ctx.fill();
    }
    return;
  }
  ctx.fillStyle = OUTSIDE[P.key]; ctx.beginPath();
  for (let i = from; i < to; i++) if (prod(i) && !src.v[i]) dot(ctx, m.px(src.x[i]), m.py(src.y[i]), r);
  ctx.fill();
  ctx.fillStyle = INSIDE[P.key]; ctx.beginPath();
  for (let i = from; i < to; i++) if (prod(i) && src.v[i]) dot(ctx, m.px(src.x[i]), m.py(src.y[i]), r);
  ctx.fill();
}

// Thin, translucent split lines; deeper splits are lighter so many lines stay readable.
function paintSplits(from, to) {
  const ctx = PS.layers.splits.getContext("2d"), m = PS.map;
  for (let i = from; i < to; i++) {
    const s = D.ms.splits[i], depth = s[5];
    ctx.strokeStyle = `rgba(160,82,45,${Math.max(0.18, 0.6 - 0.06 * depth)})`;
    ctx.lineWidth = depth < 2 ? 1.2 : 0.8;
    ctx.beginPath(); ctx.moveTo(m.px(s[1]), m.py(s[2])); ctx.lineTo(m.px(s[3]), m.py(s[4]));
    ctx.stroke();
  }
}

// Top layer: the circle (always above the points) and the MISER region being sampled.
function paintTop(P) {
  const c = P.layers.top, ctx = c.getContext("2d"), m = P.map;
  clearLayer(c);
  if (D.circle) {
    const [cx, cy, r] = D.circle;
    ctx.strokeStyle = C.circle; ctx.lineWidth = 2; ctx.beginPath();
    ctx.arc(m.px(cx), m.py(cy), r * m.scale, 0, 6.2832); ctx.stroke();
  }
  if (P.key === "ms" && S && S.curLeaf >= 0) {
    const l = D.ms.leaves[S.curLeaf];
    ctx.strokeStyle = C.current; ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    ctx.strokeRect(m.px(l[3]), m.py(l[6]), m.px(l[4]) - m.px(l[3]), m.py(l[5]) - m.py(l[6]));
    ctx.setLineDash([]);
  }
  if (P.key === "ms" && S && S.decision >= 0) paintDecision(ctx, m, S.nowTs);
}

function legends() {
  const item = (cls, color, label) => `<span><i class="${cls}" style="${
    cls === "dot" ? "background" : "border-top-color"}:${color}"></i>${label}</span>`;
  $("mc-legend").innerHTML = item("line", C.circle, "Circle") +
    item("dot", C.mc, "Inside circle") + item("dot", "#94a3b8", "Outside circle");
  $("ms-legend").innerHTML = item("line", C.circle, "Circle") +
    item("dot", C.ms, "Inside circle") + item("dot", "#94a3b8", "Outside circle") +
    item("dot", "rgba(122,60,170,0.55)", "Pilot sample") +
    item("line", "rgba(160,82,45,0.6)", "Split boundary") +
    item("line", C.current, "Region being sampled");
}

// ---------------------------------------------------------------- state
function freshState() {
  return {shown: 0, progress: 0, lastTs: null, done: false, playing: false, reported: false,
          mcIn: 0, msIn: 0,
          leafPtr: 0, curLeaf: -1, curSum: 0, curCount: 0, curArea: 0,
          doneSum: 0, doneArea: 0, leavesDone: 0, splitPtr: 0, nodePtr: 0,
          depth: 0, maxDepth: 0,
          pausePtr: 0, decision: -1, pauseStart: 0, pauseUntil: 0, nowTs: 0};
}

function advance(to) {
  const from = S.shown;
  if (to <= from) return;
  const mc = D.mc, ms = D.ms, L = ms.leaves;

  for (let i = from; i < to; i++) S.mcIn += mc.v[i];
  paintPoints(PM, mc, from, to);

  let topDirty = false;
  for (let i = from; i < to; i++) {
    if (S.curLeaf >= 0 && i >= L[S.curLeaf][0] + L[S.curLeaf][1]) { finishLeaf(); topDirty = true; }
    if (S.leafPtr < L.length && i >= L[S.leafPtr][0]) {
      S.curLeaf = S.leafPtr++; S.curSum = 0; S.curCount = 0; S.curArea = L[S.curLeaf][2];
      topDirty = true;
    }
    if (ms.kind[i] === 1) { S.curSum += ms.v[i]; S.curCount++; }
    S.msIn += ms.v[i];
  }
  if (S.curLeaf >= 0 && to >= L[S.curLeaf][0] + L[S.curLeaf][1]) { finishLeaf(); topDirty = true; }
  paintPoints(PS, ms, from, to);

  const sp = S.splitPtr;
  while (S.splitPtr < ms.splits.length && ms.splits[S.splitPtr][0] <= to) S.splitPtr++;
  if (S.splitPtr > sp) paintSplits(sp, S.splitPtr);
  while (S.nodePtr < ms.nodes.length && ms.nodes[S.nodePtr][0] <= to) {
    S.depth = ms.nodes[S.nodePtr][1]; S.maxDepth = Math.max(S.maxDepth, S.depth); S.nodePtr++;
  }
  if (topDirty) paintTop(PS);
  S.shown = to;
}

function finishLeaf() {
  const l = D.ms.leaves[S.curLeaf];
  S.doneSum += l[8];   // the leaf's area × inside-fraction, as computed by run_miser
  S.doneArea += l[2];
  S.leavesDone++;
  S.curLeaf = -1; S.curSum = 0; S.curCount = 0; S.curArea = 0;
}

// ---------------------------------------------------------------- stats
function chip(k, v) {
  return `<div title="${k}: ${v}"><span class="k">${k}</span><span class="v">${v}</span></div>`;
}

function paintStats() {
  const n = D.n, k = S.shown, pct = n ? 100 * k / n : 0;
  const state = n === 0 ? "Waiting for Run Comparison" : S.done ? "Finished" : "Sampling…";
  $("mc-state").textContent = state; $("ms-state").textContent = state;
  $("mc-bar").style.width = pct + "%"; $("ms-bar").style.width = pct + "%";

  // Plain MC: area = (inside / total) × square area (1) — identical to its estimator.
  const mcEst = S.done ? D.mc.estimate : (k ? S.mcIn / k : NaN);
  $("mc-chips").innerHTML =
    chip("Samples", `${fmtInt(k)} / ${fmtInt(n)}`) + chip("Progress", pct.toFixed(1) + "%") +
    chip("Inside", fmtInt(S.mcIn)) + chip("Outside", fmtInt(k - S.mcIn)) +
    chip("Inside ratio", k ? (100 * S.mcIn / k).toFixed(2) + "%" : "—") +
    chip(S.done ? "Final estimate" : "Estimate", fmt(mcEst)) +
    chip("True area πr²", fmt(D.reference));

  // MISER: weighted estimate = Σ region area × inside-fraction of that region,
  // never the overall inside ratio. While running it covers only finished regions.
  const curPart = S.curCount ? S.curArea * S.curSum / S.curCount : 0;
  const covered = S.doneArea + (S.curCount ? S.curArea : 0);
  const msEst = S.done ? D.ms.estimate : (covered > 0 ? S.doneSum + curPart : NaN);
  $("ms-chips").innerHTML =
    chip("Samples", `${fmtInt(k)} / ${fmtInt(n)}`) + chip("Progress", pct.toFixed(1) + "%") +
    chip("Inside", fmtInt(S.msIn)) + chip("Outside", fmtInt(k - S.msIn)) +
    chip("Inside ratio", k ? (100 * S.msIn / k).toFixed(2) + "%" : "—") +
    chip(S.done ? "Final estimate" : `Estimate · ${(100 * covered).toFixed(0)}% area`, fmt(msEst)) +
    chip("Depth", `${S.depth} (max ${S.maxDepth})`);
}

// ---------------------------------------------------------------- loop
function tick(ts) {
  rafId = null;
  if (!S.playing) return;
  // 분할 시점에서 잠깐 멈추기 위해 추가
  S.nowTs = ts;
  if (S.decision >= 0) {
    if (ts < S.pauseUntil) { paintTop(PS); paintStats(); rafId = requestAnimationFrame(tick); return; }
    S.decision = -1; S.lastTs = ts; paintTop(PS);
  }
  if (S.lastTs !== null) {
    const dt = Math.min(ts - S.lastTs, 250);
    S.progress += dt / 1000 * D.n / D.seconds;
  }
  S.lastTs = ts;
  let to = Math.min(D.n, Math.floor(S.progress));
  const sp = D.ms.splits;
  while (S.pausePtr < sp.length && sp[S.pausePtr][0] <= to) {
    const i = S.pausePtr++;
    if (sp[i][5] <= PAUSE_DEPTH) {
      to = Math.max(S.shown, sp[i][0]); S.progress = to;
      S.decision = i; S.pauseStart = ts; S.pauseUntil = ts + PAUSE_MS;
      break;
    }
  }
  advance(to);
  if (S.decision >= 0) paintTop(PS);
  if (S.shown >= D.n) { S.done = true; S.playing = false; }
  paintStats();
  if (S.done && !S.reported) {          // tell Streamlit: show the final statistics
    S.reported = true;
    send("streamlit:setComponentValue", {value: D.run_id, dataType: "json"});
  }
  if (S.playing) rafId = requestAnimationFrame(tick);
}

function start() {
  if (rafId !== null) cancelAnimationFrame(rafId);
  rafId = null;
  S = freshState();
  legends();
  Promise.all([Plotly.newPlot("mc-plot", [], LAYOUT(), CFG),
               Plotly.newPlot("ms-plot", [], LAYOUT(), CFG)]).then(() => {
    PM = makePanel("mc"); PS = makePanel("ms");
    fitPanel(PM); fitPanel(PS); paintHeat(PM); paintHeat(PS); paintTop(PM); paintTop(PS);
    paintStats(); setHeight();
    if (D.n > 0) { S.playing = true; rafId = requestAnimationFrame(tick); }
  });
}

// Re-fit after a resize: repaint everything that has been shown so far.
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!D || !PM) return;
    Promise.all([Plotly.Plots.resize("mc-plot"), Plotly.Plots.resize("ms-plot")]).then(() => {
      for (const P of [PM, PS]) { fitPanel(P); Object.values(P.layers).forEach(clearLayer); }
      paintPoints(PM, D.mc, 0, S.shown); paintPoints(PS, D.ms, 0, S.shown);
      paintHeat(PM); paintHeat(PS);
      paintSplits(0, S.splitPtr); paintTop(PM); paintTop(PS); setHeight();
    });
  }, 150);
});

// Test hook (read-only snapshot)
window.__liveState = () => S && {shown: S.shown, done: S.done, playing: S.playing,
  mcIn: S.mcIn, msIn: S.msIn, splits: S.splitPtr, leavesDone: S.leavesDone,
  nodes: S.nodePtr, depth: S.depth, msPartial: S.doneSum, runId: D.run_id, n: D.n,
  mcPoints: PM ? PM.painted : 0, msPoints: PS ? PS.painted : 0};

// A new run_id (sidebar Run Comparison) restarts from scratch; the same run_id
// (any other Streamlit rerun, e.g. a settings change) leaves the animation alone.
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const P = event.data.args.payload;
  if (!P) return;
  if (D && D.run_id === P.run_id) { setHeight(); return; }
  D = P;
  start();
});
send("streamlit:componentReady", {apiVersion: 1});
setHeight();
</script>
</body>
</html>
